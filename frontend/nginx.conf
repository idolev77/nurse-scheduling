server {
    listen 80;
    server_name _;

    # Root directory for the compiled React app
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA client-side routing ─────────────────────────────────────────────
    # For any request that is NOT a real file/directory, fall back to index.html
    # so React Router can handle the route on the client side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ───────────────────────────────────────────────────
    # Forward every /api/* request to the FastAPI backend container.
    # "backend" resolves to the Docker Compose service named "backend".
    location /api/ {
        proxy_pass         http://backend:8000;

        # Pass the original host and real client IP to the backend
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow larger request bodies (file uploads, JSON payloads)
        client_max_body_size 10M;

        # Timeouts suitable for a scheduling API
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Static asset caching ────────────────────────────────────────────────
    # Vite outputs hashed filenames (e.g. index.abc123.js) so we can safely
    # cache them for a long time without worrying about stale files.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml application/xml
                    application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary       on;
}
