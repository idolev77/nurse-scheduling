# docker-compose.yml — Nurse Scheduling System
#
# Architecture:
#   frontend  (Nginx + React SPA) → port 3000 on your machine
#   backend   (FastAPI + uvicorn)  → port 8000 on your machine
#   database  → Neon.tech (external, no local container needed)
#
# The frontend Nginx container proxies /api/* to the backend container
# using Docker's internal DNS (service name "backend").

services:

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend          # Docker build context
      dockerfile: Dockerfile
    container_name: nurse_backend

    # Load all env vars (including DATABASE_URL and SECRET_KEY) from the .env
    # file. The file stays on your host and is NEVER baked into the image.
    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"               # Expose FastAPI docs at http://localhost:8000/docs

    # Restart automatically if the process crashes (not on deliberate stop).
    restart: unless-stopped

    # Simple health probe: hit the root endpoint every 30 s.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── React Frontend (Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nurse_frontend

    ports:
      - "3000:80"                 # Open the app at http://localhost:3000

    depends_on:
      backend:
        condition: service_healthy  # Wait until the backend passes its health check

    restart: unless-stopped

    # Health probe: check that Nginx is serving the index page.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
